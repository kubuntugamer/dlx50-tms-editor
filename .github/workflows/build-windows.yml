name: Build & Release (Rust, Windows + Linux)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Build and test
        run: |
          cargo test --locked --all-targets
          cargo build --locked --release
      - name: CLI compatibility checks
        shell: bash
        run: bash tests/cli_check.sh target/release/dlx50-tms-editor.exe
      - name: Smoke test CLI
        shell: pwsh
        run: |
          .\target\release\dlx50-tms-editor.exe --version
          .\target\release\dlx50-tms-editor.exe --help
      - name: Stage portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/tms_editor | Out-Null
          Copy-Item target/release/dlx50-tms-editor.exe out/tms_editor/tms_editor.exe
          Copy-Item LICENSE out/tms_editor/
          Compress-Archive -Path out/tms_editor -DestinationPath tms_editor-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: tms_editor-windows-x64
          path: tms_editor-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Install native build and smoke-test dependencies
        run: |
          sudo apt-get update
          # No wayland-utils: it does not exist in jammy, and apt aborts the
          # whole step when one name is missing. The Wayland step below waits on
          # weston's socket instead of on wayland-info. libxkbcommon-x11-0 is
          # loaded at runtime by the X11 backend; without it the GUI dies before
          # its window exists.
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev xvfb xdotool weston \
            desktop-file-utils fakeroot dpkg-dev binutils
      - name: Build and test
        run: |
          cargo test --locked --all-targets
          cargo build --locked --release
      - name: CLI and byte-format compatibility checks
        run: bash tests/cli_check.sh target/release/dlx50-tms-editor
      - name: Validate launcher
        run: desktop-file-validate packaging/dlx50-tms-editor.desktop
      - name: Smoke test the Rust GUI on Wayland
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-runtime"
          export WAYLAND_DISPLAY=wayland-ci
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" \
            --idle-time=0 --log="$RUNNER_TEMP/weston.log" &
          WESTON_PID=$!
          APP_PID=
          cleanup() {
            if [[ -n "$APP_PID" ]]; then kill "$APP_PID" 2>/dev/null || true; fi
            kill "$WESTON_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 20); do
            if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then break; fi
            kill -0 "$WESTON_PID"
            sleep 1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          ./target/release/dlx50-tms-editor &
          APP_PID=$!
          sleep 5
          kill -0 "$APP_PID"
          echo "GUI process remained active on the headless Wayland compositor"
      - name: Smoke test the Rust GUI on X11
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" bash -euxo pipefail -c '
            ./target/release/dlx50-tms-editor &
            PID=$!
            trap "kill $PID 2>/dev/null || true" EXIT
            WID=""
            TITLE=""
            for i in $(seq 1 20); do
              WID=$(xdotool search --pid "$PID" 2>/dev/null | head -1 || true)
              if [ -n "$WID" ]; then
                TITLE=$(xdotool getwindowname "$WID")
                echo "Window is up: $TITLE"
                case "$TITLE" in "TMS / DLX-50-style Editor") break ;; esac
              fi
              kill -0 "$PID"
              sleep 1
            done
            if [ "$TITLE" != "TMS / DLX-50-style Editor" ]; then
              echo "GUI did not create its expected X11 window" >&2
              exit 1
            fi
            sleep 2
            # The File menu has to offer a way out. Sweep its rows from the bottom
            # up: the lowest row is Quit, so the Open and Save As entries that pop
            # up file dialogs are never reached, and nothing depends on this
            # runner matching the row height of a developer machine.
            for Y in $(seq 210 -4 20); do
              if ! kill -0 "$PID" 2>/dev/null; then
                echo "Quit closed the app on the row at y=$Y"
                exit 0
              fi
              xdotool mousemove 25 13 click 1
              sleep 0.4
              xdotool mousemove 90 "$Y" click 1
              sleep 0.6
            done
            if kill -0 "$PID" 2>/dev/null; then
              echo "The File menu has no working Quit entry" >&2
              exit 1
            fi
            echo "Quit closed the app"
          '
      - name: Build Debian package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.0~git$(git rev-parse --short HEAD)"; fi
          packaging/make-deb.sh "$VER" target/release/dlx50-tms-editor dist
      - name: Build portable AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps \
            AppDir/usr/share/doc/dlx50-tms-editor
          install -m 755 target/release/dlx50-tms-editor AppDir/usr/bin/dlx50-tms-editor
          install -m 644 packaging/dlx50-tms-editor.desktop AppDir/usr/share/applications/dlx50-tms-editor.desktop
          install -m 644 packaging/dlx50-tms-editor.desktop AppDir/dlx50-tms-editor.desktop
          install -m 644 packaging/dlx50-tms-editor.png AppDir/usr/share/icons/hicolor/256x256/apps/dlx50-tms-editor.png
          install -m 644 LICENSE AppDir/usr/share/doc/dlx50-tms-editor/copyright
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/dlx50-tms-editor" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          # linuxdeploy derives its output filename from the desktop Name, and
          # "TMS / DLX-50-style Editor" contains a slash, which no filename can.
          # Only the copies inside the AppDir get a slash-free name.
          sed -i 's|^Name=.*|Name=TMS DLX-50-style Editor|' \
            AppDir/usr/share/applications/dlx50-tms-editor.desktop AppDir/dlx50-tms-editor.desktop
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy.AppImage
          chmod +x linuxdeploy.AppImage
          ./linuxdeploy.AppImage --appimage-extract-and-run --appdir AppDir \
            --icon-file packaging/dlx50-tms-editor.png --output appimage
          APPIMAGE=$(find . -maxdepth 1 -type f -name '*.AppImage' ! -name 'linuxdeploy.AppImage' -print -quit)
          test -n "$APPIMAGE"
          mv "$APPIMAGE" dist/dlx50-tms-editor-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: dlx50-tms-editor-linux-x86_64
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: cd artifacts && sha256sum tms_editor-windows-x64.zip *.deb *.AppImage > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/tms_editor-windows-x64.zip
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
