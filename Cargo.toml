[package]
name = "dlx50-tms-editor"
version = "1.0.0"
edition = "2021"
description = "Cross-platform editor for DETECTO .TMS scale files"
license = "MIT"
default-run = "dlx50-tms-editor"

[lib]
name = "tms_editor"
path = "src/lib.rs"

[[bin]]
name = "dlx50-tms-editor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
